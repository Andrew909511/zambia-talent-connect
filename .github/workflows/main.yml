name: Deploy Zamwork to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Current TanStack Start dependencies require Node >=22.12.0.
          node-version: '22.22.0'
          cache: npm

      - name: Setup npm
        run: npm install -g npm@10.9.4

      - name: Test Pages configuration
        run: node --test .github/scripts/pages.test.mjs

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages manually in repository Settings → Pages → GitHub Actions.
          # Never attempt to create a missing Pages site with GITHUB_TOKEN.
          enablement: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Zamwork
        env:
          GITHUB_PAGES_BUILD: 'true'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build -- --base="$PAGES_BASE_PATH"

      - name: Prepare SPA fallback
        run: |
          test -s dist/client/index.html
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - name: Validate production Pages artifact
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: node .github/scripts/pages.mjs validate

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed website
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 "$PAGE_URL" --output /tmp/zamwork-deployed.html
          test -s /tmp/zamwork-deployed.html
          grep -q 'type="module"' /tmp/zamwork-deployed.html
